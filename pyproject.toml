[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "slice_and_dice"
version = "1.0.0"
description = "An interactive command-line shell for slicing, dicing and comparing network performance data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shauli Gal" }]
keywords = ["performance", "analytics", "cli", "repl", "networking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
slice-and-dice = "slice_and_dice.cli:main"

[project.urls]
Homepage = "https://github.com/shauligal3/slice_and_dice"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slice_and_dice = ["py.typed"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "RUF",      # ruff-specific
    "PL",       # pylint
]
ignore = [
    "D105",     # magic methods are self-explanatory
    "D107",     # __init__ is documented on the class
    "PLR0911",  # too many returns: command handlers branch a lot by design
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments: cmd.Cmd completers have a fixed signature
    "PLR0915",  # too many statements
    "PLR2004",  # magic values in comparisons
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# cmd.Cmd dispatches the end-of-file "command" to a method called do_EOF.
extend-ignore-names = ["do_EOF"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["slice_and_dice"]
branch = true
